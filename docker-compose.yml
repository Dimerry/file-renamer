services:
  file-renamer:
    build: .
    image: file-renamer:latest
    container_name: file-renamer
    ports:
      - "8999:8999"
    environment:
      DATA_ROOT: /data
      BIND_ADDR: 0.0.0.0:8999
    volumes:
      # 左侧为宿主机上要管理的目录，右侧固定为容器内 /data
      - /path/to/your/media:/data
    restart: unless-stopped
